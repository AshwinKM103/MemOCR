# Host/environment-specific settings. Values here should come from `.env`
# (see .env.example) via environment variable interpolation, so the same
# config works across machines without editing YAML.
env:
  paths:
    output_root: ${oc.env:MEMOCR_OUTPUT_ROOT,/mnt/ssd/users/durgesh/memocr/runs}
    checkpoint_root: ${oc.env:MEMOCR_CHECKPOINT_ROOT,/mnt/ssd/users/durgesh/memocr/checkpoints}
    cache_root: ${oc.env:MEMOCR_CACHE_ROOT,/mnt/ssd/users/durgesh/memocr/cache}
    nltk_data: ${oc.env:NLTK_DATA,/mnt/ssd/users/durgesh/nltk_data}
    embedding_model_path: ${oc.env:EMBEDDING_MODEL_PATH,/mnt/ssd/users/durgesh/models/all-MiniLM-L6-v2}

  gpu:
    visible_devices: ${oc.env:CUDA_VISIBLE_DEVICES,0}
    world_size: ${oc.env:WORLD_SIZE,1}

  wandb:
    entity: ${oc.env:WANDB_ENTITY,c-aimms}
    project: ${oc.env:WANDB_PROJECT,memocr}
    mode: ${oc.env:WANDB_MODE,online}  # online | offline | disabled
