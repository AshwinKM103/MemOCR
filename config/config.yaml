# Root Hydra config for MemOCR experiments.
#
# Composition order matters: later groups in `defaults` override earlier ones.
# Override any leaf value on the CLI, e.g.:
#   python scripts/memory_train.py memory.chunk_size=512 model=qwen experiment=custom
defaults:
  - env
  - memory: default
  - model: qwen
  - experiment: baseline
  - logging: console
  - _self_

# Global run identity. `run_id` defaults to a Hydra-generated timestamp unless
# overridden, so re-running the same command never silently clobbers a prior run.
run:
  name: ${experiment.name}
  seed: 42
  output_dir: ${env.paths.output_root}/${run.name}/${now:%Y%m%d_%H%M%S}

hydra:
  job:
    chdir: false
  run:
    dir: ${run.output_dir}
  sweep:
    dir: ${env.paths.output_root}/sweeps/${experiment.name}
    subdir: ${hydra.job.num}
